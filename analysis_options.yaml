include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Vendored, unmodified upstream code (pqcrypto 0.4.1, MIT).
    # Style lints do not apply to it; algorithm correctness is guarded
    # by the interop + roundtrip tests in test/.
    - lib/crypto/vendor/**

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    avoid_print: true
