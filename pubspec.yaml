name: vctcrypt
description: VCTCrypt - VCT File Encryption Tool with triple AES-256-GCM encryption.
publish_to: "none"
version: 2.3.0+16

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  # v2.1.0: platform crypto acceleration. Android gets native PBKDF2
  # (javax.crypto) and AES-GCM; iOS/macOS get native AES-GCM; every other
  # platform moves crypto off the UI thread. Same algorithms, same
  # output - verified by the same test suite.
  # Pinned to 2.3.2 exactly: 2.3.3+ depends on @internal being re-exported
  # by package:flutter/foundation.dart, which only Flutter 3.27+ does;
  # CI and local builds use Flutter 3.24.
  cryptography_flutter: 2.3.2
  file_picker: ^8.0.0
  shared_preferences: ^2.3.0
  desktop_drop: ^0.4.4
  path: ^1.9.0
  path_provider: ^2.1.0
  share_plus: ^7.2.2
  # v1.6.0: ML-KEM-768 (FIPS 203) is vendored under lib/crypto/vendor/mlkem/
  # (MIT, pqcrypto 0.4.1, unmodified algorithm code). Vendored because the
  # published package needs Dart 3.10 while CI builds on Flutter 3.24/Dart 3.5.
  # Pure Dart, zero dependencies, no network code.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

# v1.4.0 app icon: Material Design "shield", black on white.
# Config lives in icon_ios.yaml / icon_android.yaml so each CI job only
# regenerates its own platform (the scaffolding is per-platform there).

flutter:
  uses-material-design: true

  # v2.0.0: the Alipay donation QR code shown on the Donate screen.
  # Bundled, never fetched from the network.
  assets:
    - assets/donate_alipay.png

  # v2.0.0 (rebuild): Noto Sans SC (variable weight, Google Fonts /
  # OFL). Bundling a CJK font fixes inconsistent Chinese glyph
  # rendering on Windows, where Flutter would otherwise fall back to
  # whatever fonts the OS happens to have (YaHei / SimSun / ...).
  # v2.2.1: TH-Feon (天珩全字庫, ©沈天珩, freeware, cheonhyeong.com)
  # is bundled as the supplementary CJK font: it covers Han-Nom
  # (Chữ Nôm) and the extended Unicode CJK blocks (Ext B-F) that
  # Noto Sans SC lacks, and it renders them in a solid, heavy style.
  # TH-Feon intentionally contains no basic Latin or common Hanzi
  # (it is a supplementary font by design), so Noto Sans SC remains
  # the base font for English / 中文 / Français / Deutsch text; the
  # theme bumps weights two steps so Chinese reads bolder.
  fonts:
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
    - family: TH-Feon
      fonts:
        - asset: assets/fonts/TH-Feon.ttf
