name: vctcrypt
description: VCTCrypt - VCT File Encryption Tool with triple AES-256-GCM encryption.
publish_to: "none"
version: 1.4.0+5

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  file_picker: ^8.0.0
  shared_preferences: ^2.3.0
  desktop_drop: ^0.4.4
  path: ^1.9.0
  path_provider: ^2.1.0
  share_plus: ^7.2.2

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

# v1.4.0 app icon: Material Design "shield", black on white.
# Config lives in icon_ios.yaml / icon_android.yaml so each CI job only
# regenerates its own platform (the scaffolding is per-platform there).

flutter:
  uses-material-design: true
